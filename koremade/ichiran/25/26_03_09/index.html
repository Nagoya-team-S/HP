<h1>防災講演@瑞陵高等学校</h1>
	<p>
		2026年3月9日に愛知県立瑞陵高校のインターアクトクラブの皆さんに向けて、講演やクロスロードゲームを行いました。<br>
		5人でお邪魔させていただき、陸前高田で学んだことや感じたことをお伝えした後、クロスロードゲームを行いました。<br>
		今回は、インターアクトクラブの皆さん用のオリジナル問題も作成し、「自分ごと」として考え、非常に活発な意見交換をしていただきました。<br>
		予想していなかった意見もあり、私達にとっても非常に充実した時間となりました！
	</p>

<h1>「絆の日」記念交流イベント</h1>
	<p>
		2026年3月20日にオアシス21にて開催された「『絆の日』記念交流イベント」にブースを出展しました。<br>
		防災クロスロードゲームを実施したり、奇跡の一本松のおがくずを使用したグッズの販売を行いました。<br>
		また、新しい企画としておがくずを使用したキーホルダーを自分で作ってもらうワークショップを実施し、<br>
		多くの方に実際のおがくずに触れながら、世界に一つだけのキーホルダーを作っていただきました。<br>
		お越しいただいた皆様、ありがとうございました。
	</p>

<h1>絆まつり</h1>                                                                          <!-------------イベント名------------->
	<p>2026年2月22日に、岩手県陸前高田市内の陸前高田市民会館にて開催された「絆まつり」に参加しました。<br>
		ブースでは、防災クロスロードゲームや奇跡の一本松のおがくずを使ったコースター・キーホルダーなどの販売を行いました。<br>
		また、中庭での餅まき・菓子まきにも参加させていただきました。<br><br>
		
		ステージでは、絆交流のテーマソング『未来への翼』の新しいミュージックビデオも公開しました。<br>
		この日に向けて名古屋team Sの有志メンバーを中心に作成したこのMVは、本会YouTubeなどでご視聴しただけます。ぜひご覧ください！
